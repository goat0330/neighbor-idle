name: CI

on:
  push:
    branches: [main, workbuddy/develop, codex/develop]
  pull_request:

jobs:
  codex-taro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/codex-taro-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/codex-taro-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:weapp
