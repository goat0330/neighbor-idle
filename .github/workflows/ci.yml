name: CI

on:
  push:
    branches: [main, workbuddy/develop, codex/develop]
  pull_request:

jobs:
  cloud-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check CloudBase function syntax
        run: find apps/workbuddy-app/cloudfunctions -name '*.js' -print0 | xargs -0 -n1 node --check

  codex-taro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/codex-taro-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/codex-taro-app/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build:weapp
